name: build-packages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deb:
    name: deb (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Architecture-neutral package: installs on x86_64, arm64 and armhf.
          - arch: all
            runner: ubuntu-latest
            smoke: true
          # Explicit ARM packages, built from the same pure-Python payload.
          - arch: arm64
            runner: ubuntu-24.04-arm
            smoke: true
          - arch: armhf
            runner: ubuntu-latest
            smoke: false
    steps:
      - uses: actions/checkout@v4
      - name: Build .deb (${{ matrix.arch }})
        env:
          ARCH: ${{ matrix.arch }}
        run: bash packaging/deb/build-deb.sh
      - name: Install and smoke test
        if: matrix.smoke
        run: |
          set -euo pipefail
          deb=$(ls "dist/mcmgr_"*"_${{ matrix.arch }}.deb")
          sudo dpkg -i "$deb"
          mcmgr --version
          mcmgr env | head -6
          sudo dpkg -r mcmgr
      - uses: actions/upload-artifact@v4
        with:
          name: mcmgr-deb-${{ matrix.arch }}
          path: dist/*.deb
          if-no-files-found: error

  windows:
    name: windows (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.arch }}
      - name: Show interpreter architecture
        shell: pwsh
        run: |
          python -c "import platform, sys; print(sys.version); print('machine:', platform.machine())"
      - name: Build mcmgr.exe
        shell: pwsh
        run: ./packaging/windows/build.ps1
      - name: Smoke test
        shell: pwsh
        run: |
          ./dist/mcmgr.exe --version
          if ($LASTEXITCODE -ne 0) { throw "mcmgr.exe --version failed" }
          ./dist/mcmgr.exe env
          if ($LASTEXITCODE -ne 0) { throw "mcmgr.exe env failed" }
      - name: Name the artifact for its architecture
        shell: pwsh
        run: Move-Item dist/mcmgr.exe "dist/mcmgr-windows-${{ matrix.arch }}.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: mcmgr-windows-${{ matrix.arch }}
          path: dist/mcmgr-windows-*.exe
          if-no-files-found: error
