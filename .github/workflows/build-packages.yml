name: build-packages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deb:
    name: Debian package (${{ matrix.arch }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build .deb
        run: bash packaging/deb/build-deb.sh
      - name: Smoke test
        run: |
          sudo dpkg -i dist/mcmgr_*_all.deb
          mcmgr --version
          mcmgr env | head -5
          sudo dpkg -r mcmgr
      - uses: actions/upload-artifact@v4
        with:
          name: mcmgr-deb
          path: dist/*.deb
          if-no-files-found: error

  windows-exe:
    name: Windows executable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build mcmgr.exe
        shell: pwsh
        run: ./packaging/windows/build.ps1
      - name: Smoke test
        shell: pwsh
        run: ./dist/mcmgr.exe --version
      - uses: actions/upload-artifact@v4
        with:
          name: mcmgr-windows
          path: dist/mcmgr.exe
          if-no-files-found: error
